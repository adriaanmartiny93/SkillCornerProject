<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ payload.title or kind }}</title>
<style>
{{ fonts_css | safe }}
html,body{margin:0;background:#161917;color:#f5f6f5;font-family:'IBM Plex Sans',sans-serif}
.sc-page{max-width:{{ width }}px;margin:0 auto;padding:24px}
.sc-meta{font-size:12px;color:#858c86;margin-top:12px}
</style>
<script>{{ echarts_js | safe }}</script>
<script>{{ sc_charts_js | safe }}</script>
</head>
<body>
<div class="sc-page">
<div id="root"></div>
{% block meta %}<div class="sc-meta">{{ generated }}{% if source %} · {{ source }}{% endif %}</div>{% endblock %}
</div>
<script>SC.render(document.getElementById('root'), {{ kind | tojson }}, {{ payload | tojson }}, null);</script>
</body>
</html>
